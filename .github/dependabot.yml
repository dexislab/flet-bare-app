version: 2
updates:
  # 1. Keeps GitHub Actions & composite action tags up to date
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-flet"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"

  # 2. Keeps Python packages in pyproject.toml & uv.lock up to date
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
