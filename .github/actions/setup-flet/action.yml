name: Setup Flet Environment
description: Installs uv, syncs frozen Python dependencies, and optionally caches the Flutter SDK

inputs:
  cache-flutter:
    description: 'Whether to restore/save the Flutter SDK cache'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Sync Python dependencies
      shell: bash
      run: uv sync --frozen

    - name: Cache Flutter SDK
      if: inputs.cache-flutter == 'true'
      uses: actions/cache@v5
      with:
        path: ~/flutter
        key: flutter-sdk-${{ runner.os }}-${{ hashFiles('uv.lock') }}
