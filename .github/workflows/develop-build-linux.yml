name: Build Flet App for Linux / Develop

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch: # Allows manual runs from the GitHub Actions tab

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync --frozen

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-sdk-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Build Flet Linux application
        run: uv run flet build linux --yes -o ./dist

      - name: Package build output as tar.gz
        run: tar -czvf shadcn-showcase-linux-x64.tar.gz -C dist .

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadcn-showcase-linux-x64
          path: shadcn-showcase-linux-x64.tar.gz
          retention-days: 14
